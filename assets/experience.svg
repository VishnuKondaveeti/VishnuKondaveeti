<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #0b0f17; stroke: #1e293b; stroke-width: 1; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #ffffff; font-weight: 700; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #38bdf8; font-weight: 600; }
      .card-date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .bullet-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Left Card: IBM SkillsBuild -->
  <g transform="translate(0, 0)">
    <rect width="440" height="235" rx="10" class="card-bg" />
    
    <!-- IBM Logo Badge -->
    <rect x="20" y="20" width="58" height="30" rx="4" fill="#052fad" />
    <text x="49" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">IBM</text>
    
    <!-- Header Text -->
    <text x="90" y="32" class="card-title">AI &amp; Cloud Virtual Intern</text>
    <text x="90" y="48" class="card-sub">IBM SkillsBuild</text>
    <text x="90" y="64" class="card-date">🗓️ Sep 2025 – Oct 2025</text>

    <!-- Bullets -->
    <circle cx="28" cy="92" r="2.5" fill="#38bdf8" />
    <text x="38" y="96" class="bullet-text">Developed ML workflows using Python for preprocessing,</text>
    <text x="38" y="112" class="bullet-text">feature engineering, model training and evaluation.</text>

    <circle cx="28" cy="134" r="2.5" fill="#38bdf8" />
    <text x="38" y="138" class="bullet-text">Applied supervised &amp; unsupervised learning across</text>
    <text x="38" y="154" class="bullet-text">classification and regression tasks.</text>

    <circle cx="28" cy="176" r="2.5" fill="#38bdf8" />
    <text x="38" y="180" class="bullet-text">Used cross-validation, Precision, Recall and F1-Score for</text>
    <text x="38" y="196" class="bullet-text">model evaluation.</text>

    <circle cx="28" cy="214" r="2.5" fill="#38bdf8" />
    <text x="38" y="218" class="bullet-text">Explored cloud-based AI workflows and practical ML dev.</text>
  </g>

  <!-- Right Card: Shell -->
  <g transform="translate(460, 0)">
    <rect width="440" height="235" rx="10" class="card-bg" />
    
    <!-- Shell Logo Badge -->
    <rect x="20" y="20" width="58" height="30" rx="4" fill="#ffd500" />
    <text x="49" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#dd1d21" text-anchor="middle">Shell</text>
    
    <!-- Header Text -->
    <text x="90" y="32" class="card-title">AI &amp; Data Analytics Virtual Intern</text>
    <text x="90" y="48" class="card-sub">Shell</text>
    <text x="90" y="64" class="card-date">🗓️ Oct 2025 – Nov 2025</text>

    <!-- Bullets -->
    <circle cx="28" cy="92" r="2.5" fill="#38bdf8" />
    <text x="38" y="96" class="bullet-text">Performed EDA using Python, Pandas and NumPy.</text>

    <circle cx="28" cy="124" r="2.5" fill="#38bdf8" />
    <text x="38" y="128" class="bullet-text">Applied data cleaning, transformation and validation on</text>
    <text x="38" y="144" class="bullet-text">structured datasets.</text>

    <circle cx="28" cy="166" r="2.5" fill="#38bdf8" />
    <text x="38" y="170" class="bullet-text">Used statistical analysis and visualization to identify</text>
    <text x="38" y="186" class="bullet-text">patterns and evaluate model outputs.</text>

    <circle cx="28" cy="208" r="2.5" fill="#38bdf8" />
    <text x="38" y="212" class="bullet-text">Supported data-driven decision making through analytical</text>
    <text x="38" y="228" class="bullet-text">insights.</text>
  </g>
</svg>
