<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <style>
      .proj-card { fill: #0b0f17; stroke: #1e293b; stroke-width: 1; rx: 8; }
      .proj-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #38bdf8; font-weight: 700; }
      .proj-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #c9d1d9; }
      .proj-lang { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      a { text-decoration: none; cursor: pointer; }
    </style>
  </defs>

  <!-- Row 1 -->
  <!-- Card 1: agentOS -->
  <a href="https://github.com/VishnuKondaveeti/agentOS" target="_blank">
    <g transform="translate(0, 0)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">agentOS</text>
      <text x="16" y="50" class="proj-desc">Autonomous AI Personal Assistant</text>
      <text x="16" y="66" class="proj-desc">with 4 pipelines &amp; multi-channel</text>
      <text x="16" y="82" class="proj-desc">communication.</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>

  <!-- Card 2: agentic-research-matrix -->
  <a href="https://github.com/VishnuKondaveeti/agentic-research-matrix" target="_blank">
    <g transform="translate(306, 0)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">agentic-research-matrix</text>
      <text x="16" y="50" class="proj-desc">16-agent research platform with</text>
      <text x="16" y="66" class="proj-desc">hybrid RAG + Knowledge Graph</text>
      <text x="16" y="82" class="proj-desc">(47 papers, 1,449+ embeddings).</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>

  <!-- Card 3: Agentic-RAG-Pipeline -->
  <a href="https://github.com/VishnuKondaveeti/Agentic-RAG-Pipeline" target="_blank">
    <g transform="translate(612, 0)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">Agentic-RAG-Pipeline</text>
      <text x="16" y="50" class="proj-desc">Agentic RAG system with dynamic</text>
      <text x="16" y="66" class="proj-desc">routing, citations &amp; local DeepSeek-</text>
      <text x="16" y="82" class="proj-desc">R1 (Ollama).</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>

  <!-- Row 2 -->
  <!-- Card 4: semantic-search-system -->
  <a href="https://github.com/VishnuKondaveeti/semantic-search-system" target="_blank">
    <g transform="translate(0, 118)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">semantic-search-system</text>
      <text x="16" y="50" class="proj-desc">Semantic search using embeddings,</text>
      <text x="16" y="66" class="proj-desc">ChromaDB &amp; FastAPI.</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>

  <!-- Card 5: Autonomous-AI-Companies -->
  <a href="https://github.com/VishnuKondaveeti/Autonomous-AI-Companies" target="_blank">
    <g transform="translate(306, 118)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">Autonomous-AI-Companies</text>
      <text x="16" y="50" class="proj-desc">Curated list of autonomous</text>
      <text x="16" y="66" class="proj-desc">AI companies with research</text>
      <text x="16" y="82" class="proj-desc">&amp; insights.</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>

  <!-- Card 6: RealTime-AI-Air-Sketch -->
  <a href="https://github.com/VishnuKondaveeti/RealTime-AI-Air-Sketch-AICTC-Internship" target="_blank">
    <g transform="translate(612, 118)">
      <rect width="288" height="105" class="proj-card" />
      <text x="16" y="28" class="proj-title">RealTime-AI-Air-Sketch</text>
      <text x="16" y="50" class="proj-desc">Real-time AI air sketch recognition</text>
      <text x="16" y="66" class="proj-desc">&amp; processing system.</text>
      <circle cx="20" cy="95" r="3.5" fill="#3572a5" />
      <text x="28" y="98" class="proj-lang">Python</text>
    </g>
  </a>
</svg>
