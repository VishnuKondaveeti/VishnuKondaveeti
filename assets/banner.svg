<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Accent Gradient for Glow & Highlights -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Radial Glow in Center/Right -->
    <radialGradient id="nodeGlow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 1.5px;
      fill: #38bdf8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, sans-serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .mono-pill {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px;
      fill: #cbd5e1;
      font-weight: 500;
    }
    .node-line {
      stroke: #334155;
      stroke-width: 1;
      stroke-dasharray: 4 2;
    }
    .active-line {
      stroke: url(#cyanBlueGrad);
      stroke-width: 1.5;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Radial Glow on Neural System Right Side -->
  <rect width="100%" height="100%" fill="url(#nodeGlow)" rx="16" />

  <!-- Subtle Border Line -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

  <!-- Abstract Agentic Graph & Neural Architecture (Right Half) -->
  <g transform="translate(680, 20)">
    <!-- Interconnecting Topology / Agent Loops -->
    <path d="M120 150 L240 80 L360 120 L440 200 L320 250 L180 220 Z" fill="url(#accentGlow)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- State Flow / Graph Edges -->
    <line x1="120" y1="150" x2="240" y2="80" class="active-line" opacity="0.8" />
    <line x1="240" y1="80" x2="360" y2="120" class="node-line" />
    <line x1="360" y1="120" x2="440" y2="200" class="active-line" opacity="0.6" />
    <line x1="440" y1="200" x2="320" y2="250" class="node-line" />
    <line x1="320" y1="250" x2="180" y2="220" class="active-line" opacity="0.7" />
    <line x1="180" y1="220" x2="120" y2="150" class="node-line" />
    <line x1="240" y1="80" x2="320" y2="250" class="node-line" stroke-dasharray="2 2" />
    <line x1="120" y1="150" x2="360" y2="120" class="node-line" stroke-dasharray="3 3" />

    <!-- Secondary Nodes (Peripheral) -->
    <line x1="240" y1="80" x2="260" y2="30" class="node-line" />
    <circle cx="260" cy="30" r="3" fill="#64748b" />

    <line x1="440" y1="200" x2="480" y2="240" class="node-line" />
    <circle cx="480" cy="240" r="3" fill="#64748b" />

    <line x1="180" y1="220" x2="130" y2="270" class="node-line" />
    <circle cx="130" cy="270" r="3" fill="#64748b" />

    <!-- Node 1: Input / Perception -->
    <circle cx="120" cy="150" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="120" cy="150" r="5" fill="#38bdf8" />

    <!-- Node 2: Reasoning Core / LLM -->
    <circle cx="240" cy="80" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="240" cy="80" r="8" fill="url(#cyanBlueGrad)" filter="url(#glowEffect)" />

    <!-- Node 3: Retrieval / Vector Store -->
    <circle cx="360" cy="120" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="360" cy="120" r="6" fill="#38bdf8" />

    <!-- Node 4: Action / Tool Execution -->
    <circle cx="440" cy="200" r="18" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="440" cy="200" r="6" fill="#818cf8" />

    <!-- Node 5: Memory / Persistence -->
    <circle cx="320" cy="250" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="320" cy="250" r="5" fill="#38bdf8" />

    <!-- Node 6: Feedback / Evaluation Loop -->
    <circle cx="180" cy="220" r="13" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <circle cx="180" cy="4" fill="#64748b" />

    <!-- Micro-labels for technical authenticity -->
    <text x="240" y="50" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">ORCHESTRATION</text>
    <text x="360" y="98" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">RAG / EMBEDDINGS</text>
    <text x="440" y="235" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">TOOL EXECUTION</text>
    <text x="320" y="280" font-family="'SF Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">STATE MEMORY</text>
  </g>

  <!-- Left Content: Branding, Tagline, Identity -->
  <g transform="translate(70, 75)">
    <!-- Terminal status chip -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="mono-pill" fill="#94a3b8">SYS_STATUS: ACTIVE // AI DEV</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="65" class="title-text">VISHNU KONDAVEETI</text>

    <!-- Role / Title -->
    <text x="0" y="100" class="subtitle-text">AI &amp; GENAI SOFTWARE ENGINEER</text>

    <!-- Brief Description / Focus -->
    <text x="0" y="132" class="tagline-text">Architecting Agentic Workflows, Retrieval-Augmented Generation &amp; Robust Backend Systems</text>

    <!-- Technology Capsules in Hero Banner -->
    <g transform="translate(0, 155)">
      <!-- Capsule 1 -->
      <rect x="0" y="0" width="112" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="56" y="18" class="mono-pill" text-anchor="middle">AGENTIC AI</text>

      <!-- Capsule 2 -->
      <rect x="122" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="191" y="18" class="mono-pill" text-anchor="middle">LLM PIPELINES</text>

      <!-- Capsule 3 -->
      <rect x="270" y="0" width="105" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="322" y="18" class="mono-pill" text-anchor="middle">RAG &amp; VECTORS</text>

      <!-- Capsule 4 -->
      <rect x="385" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="455" y="18" class="mono-pill" text-anchor="middle">BACKEND / FASTAPI</text>
    </g>
  </g>
</svg>
