<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#avatarBg)" stroke="url(#avatarGlow)" stroke-width="3" />
  <circle cx="80" cy="80" r="70" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 3" />
  
  <!-- Stylized AI Engineer Silhouette -->
  <!-- Head -->
  <circle cx="80" cy="62" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Eyes / Neural Visor -->
  <rect x="66" y="58" width="28" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
  
  <!-- Torso / Shoulders -->
  <path d="M40 128 C40 100, 60 92, 80 92 C100 92, 120 100, 120 128 Z" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
  
  <!-- Monogram Initials overlay -->
  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="1">VK // AI</text>
</svg>
